name: Deploy GitHub Pages

on:
  # Trigger when the 'news.json' is updated by post-news.yml,
  # or when any frontend files in the 'docs' directory are manually changed and pushed.
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_run:
    workflows: ["Post Game News"]
    types:
      - completed
  # Allow manual triggering of the page build without posting to Discord
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
